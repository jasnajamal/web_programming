
<html>
<body>
<h2>String Functions and Math Object Functions</h2>
<script>
var s1="Welcome to JS Programming"
document.writeln(s1,"<br>")
document.writeln("charAt(3)  is ",s1.charAt(3),"<br>")
document.writeln(s1.toUpperCase(),"<br>")
var s5=" Hello "
document.writeln(s5.concat(s1),"<br>")
let num = 5.5
document.writeln("Number: " , num ,"<br>")
document.writeln("round : " ,Math.round(num) ,"<br>")
document.writeln("floor : " , Math.floor(num) , "<br>")
document.writeln("sqrt of 25 : ", Math.sqrt( 25 ) , "<br>")     
document.writeln("PI : " , Math.PI , "<br>")
</script>
</body>
</html>
